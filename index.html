<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS 飾品市場日報</title>
<style>
:root{color-scheme:light;--bg:#f3f5f7;--sf:#fff;--tx:#17202a;--mu:#5d6b7a;--ln:#dde3e9;--ac:#2563c9;--up:#d6322e;--dn:#1a8f4c;--wn:#b9770e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171d;--sf:#1b222a;--tx:#e6ebf0;--mu:#93a1b0;--ln:#2d3743;--ac:#6ea2f5;--up:#ff6b66;--dn:#4cc982;--wn:#e6a93d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171d;--sf:#1b222a;--tx:#e6ebf0;--mu:#93a1b0;--ln:#2d3743;--ac:#6ea2f5;--up:#ff6b66;--dn:#4cc982;--wn:#e6a93d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:.02em}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 20px;font-size:13px}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:16px}
.note{color:var(--mu);font-size:13px;margin:0 0 12px}
.kpi{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mu);font-size:13px}
.seg button{border:1px solid var(--ln);background:transparent;color:var(--tx);padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.rec{border-top:1px solid var(--ln);padding:10px 0}
.rec:first-of-type{border-top:0}
.rec h3{margin:0;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:10px;border:1px solid currentColor;margin-left:8px;vertical-align:1px}
.rec p{margin:2px 0 0;color:var(--mu);font-size:13px}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px;font:12px/1.5 ui-monospace,Menlo,monospace}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;margin:8px 8px 0 0}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--ln)}
#msg{font-size:13px;color:var(--wn)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg text{fill:var(--mu);font-size:10px}
.lang{display:flex;gap:8px;margin:0 0 14px}.lang button{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:6px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}.lang button[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
<body>
<main>
<div class="lang" role="group" aria-label="Language" style="display:none"><button id="ltw">繁體中文（台灣）</button><button id="lcn">简体中文（中国大陆）</button></div>
<div class="lang" role="group" aria-label="Currency"><button id="ccny"></button><button id="ctwd"></button><label id="rlab" hidden style="font-size:13px;color:var(--mu);align-self:center"><span id="rl"></span> <input id="rate" type="number" step="0.01" min="0.1" style="width:72px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 6px;font:inherit"></label></div>
<h1 data-k="title"></h1>
<p class="sub" id="meta"></p>
<section><h2 data-k="rt"></h2><p class="note" id="rsrc"></p><div class="kpi" id="rkpi"></div><div class="wrap" style="max-height:480px;overflow:auto"><table id="rtab"></table></div><div id="rrec" style="margin-top:8px"></div><p class="note" data-k="rnote" style="margin-top:12px"></p></section>
<section><h2 data-k="kt"></h2><p class="note" data-k="kn"></p><input id="kq" type="search" style="width:100%;max-width:280px;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit"><div class="wrap" style="max-height:480px;overflow:auto"><table id="ktab"></table></div></section>
<section><h2 data-k="gt"></h2><p class="note" data-k="gn"></p><input id="gq" type="search" style="width:100%;max-width:280px;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit"><div class="wrap" style="max-height:480px;overflow:auto"><table id="gtab"></table></div></section>
<section><h2 data-k="lt"></h2><p class="note" data-k="ln"></p><input id="gq2" type="search" style="width:100%;max-width:280px;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit"><div class="wrap" style="max-height:480px;overflow:auto"><table id="gtab2"></table></div></section>
<section><h2 data-k="st"></h2><p class="note" data-k="sn"></p><input id="sq" type="search" style="width:100%;max-width:280px;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit"><div class="wrap" style="max-height:480px;overflow:auto"><table id="stab"></table></div></section>
<section><h2 data-k="ut"></h2><p class="note" data-k="un"></p><input id="uq" type="search" style="width:100%;max-width:280px;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit"><div class="wrap" style="max-height:480px;overflow:auto"><table id="utab"></table></div></section>
<section><h2 data-k="sph"></h2><p class="note" data-k="spn"></p><textarea id="sp" style="min-height:70px"></textarea><div><button class="btn" id="spgo" data-k="spgo"></button><span id="spm" style="font-size:13px;color:var(--wn)"></span></div></section>
<section><h2 data-k="h1"></h2><p class="note" data-k="n1"></p><div class="kpi" id="kpi"></div>
<div class="seg" role="group"><button id="bq" aria-pressed="true"></button><button id="bt" aria-pressed="false"></button></div>
<div class="wrap"><svg id="chart" viewBox="0 0 640 190" width="100%" role="img"></svg></div></section>
<section><h2 data-k="h2"></h2><p class="note" data-k="n2"></p><div class="wrap"><table id="drop"></table></div></section>
<section><h2 data-k="h3"></h2><p class="note" data-k="n3"></p><div id="recs"></div><p class="note" id="wd" style="margin-top:12px"></p></section>
<section><h2 data-k="h4"></h2><p class="note" data-k="n4"></p><textarea id="csv"></textarea>
<div><button class="btn" id="go"></button><button class="btn alt" id="reset"></button><input type="file" id="file" accept=".csv,.txt"> <span id="msg"></span></div></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US'),pc=n=>(n>0?'+':'')+(n*100).toFixed(1)+'%',cls=n=>n>0?'up':n<0?'dn':'';
const T={tw:{lang:'zh-Hant',title:'CS 飾品市場日報',rt:'真實行情快照：刀跌幅榜（近 30 天）',cu:['人民幣 ¥','新台幣 NT$'],ut:'手套 30 日銷量榜（前 100 名）',un:'資料：SkinPan 手套分類銷量排名，2026-11-19 複製，幣別為人民幣，區間以 30 天標示。這 100 名裡只有 3 件上漲（奶油細條紋戰痕累累 +2.71%、逐滄浪戰痕累累 +1.21%、日芒戰痕累累 +1.13%）；銷量最大的集中在 ¥150 到 ¥300 的久經沙場、戰痕累累款，榜首是摩托手套｜交運（久經沙場，30 日成交 3,347 件）。這裡沒有圖片。',st:'刀 30 日銷量榜（前 100 名）',sn:'資料：SkinPan 匕首分類銷量排名，2026-11-19 複製，幣別為人民幣，區間以 30 天標示。這 100 名的價格幾乎都落在 ¥200 到 ¥1,200 之間，銷量集中在 ¥200 到 ¥400 的久經沙場款；只有 1 件上漲（求生匕首｜枯焦之色，+2.28%）。這裡沒有圖片。',lt:'手套 30 日跌幅榜（前 100 名）',ln:'資料：SkinPan 手套分類跌幅排名，2026-11-19 複製，幣別為人民幣，區間以 30 天標示。第 1 名駕駛手套｜逐滄浪（破損不堆）跌了 34.5%，其餘大多落在 −8% 到 −16% 之間。名稱已轉成繁體並套用台灣用語，這裡沒有圖片。',gt:'手套 30 日漲幅榜（前 100 名）',gn:'資料：SkinPan 手套分類漲幅排名，2026-11-19 複製，幣別為人民幣，區間以 30 天標示。前 100 名裡只有 9 件上漲，最多漲 34.9%（第 1 名只成交 99 件、量比 0.26，樣本偏薄），第 100 名已跌到 −5.73%。名稱已轉成繁體並套用台灣用語，這裡沒有圖片。',kt:'刀 30 日漲幅榜（匕首分類，前 100 名）',kn:'資料：SkinPan 匕首分類 30 天漲幅排名，2026-11-20 複製，幣別為人民幣。榜單排到第 100 名時漲幅已是 −0.25%：在 SkinPan 計入的刀（日成交至少 1 件）裡，只有 90 件上漲，最多漲 19.5%。跌最凶的在榜單另一端，不在這份資料裡。這裡只有名稱，沒有圖片。',ksr:'搜尋名稱，例如 蝴蝶刀',kth:['名次','飾品','現價','30 日漲幅','30 日成交','成交額','量比','掛單'],sph:'貼上 SkinPan 榜單（最多 100 件）',spn:'到 SkinPan 的<a href="https://skinpan.com/zh/market/rankings/losers" target="_blank" rel="noopener" style="color:var(--ac)">跌幅排名</a>，分類選匕首或手套、區間選 30 天，全選表格後貼到下面。系統只保留刀與手套，最多 100 件，會取代上方的表格。貼上的名稱會自動轉成繁體。本頁無法載入外部圖片，原有的 7 件可點名稱到 SkinPan 看圖。',spgo:'套用榜單',spe:'沒有讀到刀或手套的資料，請確認複製的是完整表格。',spo:n=>`已套用 ${n} 件。`,rl:'匯率 1 人民幣 ≈ 新台幣',rcn:'新台幣金額是依匯率換算的參考值，不是實際成交價。',rs:d=>`資料來源：SkinPan 大盤與跌幅榜，${d} 讀取。`,rk:['匕首指數','手套指數','大盤指數'],rsales:'日均成交',rth:['飾品','現價','30 日跌幅','30 日成交','成交額','量比','掛單'],rsg:{t:'樣本太薄',u:'分批觀察',d:'先觀望'},rsig:{t:(s,l)=>`30 日只成交 ${s} 件、掛單 ${l} 件，樣本太薄，價格容易被單筆交易扭曲，先不要當成買點。`,u:(c,v)=>`跌 ${c}%，成交量是均量的 ${v} 倍，賣壓可能正在釋放，可小額分批觀察。`,d:(c,v)=>`跌 ${c}%，但量比只有 ${v}，還沒有止跌訊號，先觀望。`},rnote:'SkinPan 刀類與手套的跌幅榜前 100 名都已收錄。它只提供 30 日累計的價量，沒有逐日資料，因此下面三段（每日成交量、單日跌幅、入手時機）仍是模擬資料。以上不構成投資建議。',h1:'成交概況',n1:'未匯入逐日資料時，顯示 SkinPan 榜單頁面頂部的 30 日累計成交（匕首、手套各一份，人民幣計價）。匯入逐日資料後，這裡會改成每日成交量圖表。',q:'成交件數',t:'成交額',h2:'30 日 function allD(){const g=GL.map(r=>[tw(GT[r[0]][1]+' | '+r[1]+'（'+KW[r[2]+1][1]+'）'),0,r[3],r[4]/100,r[5],r[6]*1e4,r[7],r[8]]);return REAL.rows.map(r=>[r[0],0,r[2],r[3],r[4],r[5],r[6],r[7]]).concat(g)}
function renderDrop(){const l=L(),a=allD().sort((x,y)=>x[3]-y[3]),ok=a.filter(r=>r[4]>=40&&r[7]>60),foc=a.filter(r=>/蝴蝶刀|骷髅匕首|M9 刺刀|爪子刀/.test(r[0]));
 $('#drop').innerHTML='<tr>'+l.rth.map((h,j)=>`<th>${j==1||j==4?h+' '+sym():h}</th>`).join('')+'</tr>'+a.slice(0,10).map((r,i)=>`<tr><td>${i+1}. ${esc(r[0])}</td><td>${M(r[2]).toFixed(2)}</td><td class="${cls(r[3])}">${pc(r[3])}</td><td>${fmt(r[4])}</td><td>${fmt(M(r[5]))}</td><td>${r[6].toFixed(2)}</td><td>${fmt(r[7])}</td></tr>`).join('');
 $('#recs').innerHTML=[...foc].sort((x,y)=>((y[4]<40||y[7]<=60)-(x[4]<40||x[7]<=60))*-1||((y[3]*-100+(y[6]-1)*10)-(x[3]*-100+(x[6]-1)*10))).map(r=>{const t=(r[4]<40||r[7]<=60)?'t':r[6]>=1?'u':'d',c=Math.abs(r[3]*100).toFixed(1),v=r[6].toFixed(2),ex=r[3]<=-.3?' 跌幅超過三成，先確認是否有改版或單筆異常成交。':'';
  return `<div class="rec"><h3>${esc(r[0])}<span class="tag" style="color:var(${t=='u'?'--up':t=='t'?'--mu':'--wn'})">${l.rsg[t]}</span></h3><p>${t=='t'?l.rsig.t(r[4],r[7]):l.rsig[t](c,v)}${ex}</p></div>`}).join('');
 $('#wd').textContent=`只關注蝴蝶刀、骷髅匕首、M9 刺刀、爪子刀：榜單中共 ${foc.length} 件，其中 ${foc.filter(r=>r[4]<40||r[7]<=60).length} 件樣本過薄。`}
function load(rows,k){const st=analyze(rows);if(st.stats.length<10||st.dates.length<10)throw new Error('x');state=st;srcK=k;render()}
function csvLine(x){const o=[];let c='',q=false;for(const ch of x){if(ch=='"')q=!q;else if(ch==','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
function agg(list){const m={};list.forEach(([d,n,p,v])=>{if(!(p>0)||!(v>=0)||!d||!n)return;n=String(n).replace(/^★\s*/,'').trim();n=ALIAS[n]||ALIAS[norm(n)]||n;if(!KG.test(n))return;const k=d+'|'+n,e=m[k]=m[k]||{d,n,pv:0,v:0,ps:0,c:0};e.pv+=p*v;e.v+=v;e.ps+=p;e.c++});return Object.values(m).map(e=>[e.d,e.n,+(e.v?e.pv/e.v:e.ps/e.c).toFixed(2),e.v])}
function parse(t){t=t.trim();const pts=[];
 if(t[0]=='['||t[0]=='{'){let j=JSON.parse(t);if(!Array.isArray(j))j=[j];
  j.forEach(r=>{const n=r.marketHashName;if(!n)return;if(Array.isArray(r.prices))r.prices.forEach(x=>pts.push([String(x.time).slice(0,10),n,+x.medianPrice,+x.volume]));else if(r.time)pts.push([String(r.time).slice(0,10),n,+r.medianPrice,+r.volume])});return agg(pts)}
 const ls=t.split(/\r?\n/),h=csvLine(ls[0]),ix=k=>h.indexOf(k);
 if(ix('marketHashName')>=0&&ix('time')>=0){const a=ix('marketHashName'),b=ix('time'),c=ix('medianPrice'),d=ix('volume');ls.slice(1).forEach(x=>{const r=csvLine(x);pts.push([(r[b]||'').slice(0,10),r[a],+r[c],+r[d]])});return agg(pts)}
 return agg(parseSimple(t))}
function parseSimple(t){const rows=[];
 t.split(/\r?\n/).forEach(x=>{const c=x.split(',');if(c.length<4)return;const v=+c.pop(),p=+c.pop(),d=c.shift().trim(),n=c.join(',').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&n&&p>0&&v>=0)rows.push([d,ALIAS[n]||n,p,v])});return rows}
function apply(t){try{load(parse(t),'user');$('#msg').textContent=''}catch(e){$('#msg').textContent=L().err}}
function setLang(x){lang=x;try{localStorage.setItem('lang',x)}catch(e){}render()}
function setCur(x){cur=x;try{localStorage.setItem('cur',x)}catch(e){}render()}
$('#ccny').onclick=()=>setCur('cny');$('#ctwd').onclick=()=>setCur('twd');
$('#rate').onchange=e=>{const v=+e.target.value;if(v>0){rate=v;try{localStorage.setItem('rate',v)}catch(x){}render()}};
$('#ltw').onclick=()=>setLang('tw');$('#lcn').onclick=()=>setLang('cn');
$('#bq').onclick=()=>{mode='q';$('#bq').setAttribute('aria-pressed',true);$('#bt').setAttribute('aria-pressed',false);chart()};
$('#bt').onclick=()=>{mode='t';$('#bt').setAttribute('aria-pressed',true);$('#bq').setAttribute('aria-pressed',false);chart()};
$('#go').onclick=()=>apply($('#csv').value);
$('#reset').onclick=()=>{load(gen(),'sim');$('#msg').textContent=''};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)};
load(gen(),'sim');
</script>
