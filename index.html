<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS 飾品市場日報</title>
<style>
:root{color-scheme:light;--bg:#f3f5f9;--bg1:#f8f6f9;--bg2:#edf1f7;--sf:#fff;--tx:#1f2430;--mu:#667085;--ln:#e1e6ee;--ac:#d6457f;--acx:#fff;--up:#d92d3a;--dn:#12a05c;--wn:#5b6fc9;--nav:#1c2340;--row:#f8f9fc;--hv:#fdeef4;--navt:#eef1f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f131c;--bg1:#151a29;--bg2:#0e1420;--sf:#171d2b;--tx:#e8ecf4;--mu:#98a2b8;--ln:#283044;--ac:#f08ab4;--acx:#2a0f1c;--up:#ff6b6b;--dn:#3ecf8e;--wn:#8ea2f0;--nav:#090c13;--row:#1b2232;--hv:#2b2030}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f131c;--bg1:#151a29;--bg2:#0e1420;--sf:#171d2b;--tx:#e8ecf4;--mu:#98a2b8;--ln:#283044;--ac:#f08ab4;--acx:#2a0f1c;--up:#ff6b6b;--dn:#3ecf8e;--wn:#8ea2f0;--nav:#090c13;--row:#1b2232;--hv:#2b2030}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:30}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--navt);border-bottom:2px solid var(--ac)}
.bar{max-width:1040px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.03em;white-space:nowrap}
.brand i{width:14px;height:14px;background:var(--ac);transform:rotate(45deg);border-radius:3px}
.nav nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
.nav nav a{color:var(--navt);opacity:.75;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:14px;white-space:nowrap}
.nav nav a:hover{opacity:1;background:rgba(255,255,255,.09)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lang{display:flex}
.lang button{border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--navt);padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;margin-left:-1px}
.lang button:first-child{border-radius:6px 0 0 6px;margin-left:0}.lang button:last-of-type{border-radius:0 6px 6px 0}
.lang button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:600}
.nav label{color:var(--navt)!important;font-size:12px!important;opacity:.85}
main{max-width:1040px;margin:0 auto;padding:6px 16px 48px}
h1{font-size:24px;margin:18px 0 2px;letter-spacing:.02em}
h2{font-size:17px;margin:0 0 4px;padding-left:10px;border-left:4px solid var(--ac);line-height:1.3}
.sub{color:var(--mu);margin:0 0 16px;font-size:13px}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.note{color:var(--mu);font-size:13px;margin:0 0 12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi>div{background:var(--row);border:1px solid var(--ln);border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi span{color:var(--mu);font-size:12px}
.seg{display:inline-flex;margin-bottom:6px}
.seg button{border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:4px 14px;font:inherit;font-size:13px;cursor:pointer;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--sf);z-index:1}
tr:nth-child(even) td{background:var(--row)}
tr:hover td{background:var(--hv)}
td.up,td.dn{font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}
.star{color:var(--ac)}.st{color:var(--ac);font-weight:600}.im{margin-left:6px;font-size:11px;line-height:1.5;padding:0 5px;border:1px solid var(--ln);border-radius:4px;text-decoration:none;color:var(--ac)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips button{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:14px;padding:2px 12px;font:inherit;font-size:13px;cursor:pointer}.chips button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.wr{display:inline-block;font-size:11px;line-height:1.5;padding:0 6px;border:1px solid var(--ln);border-radius:4px;color:var(--mu);margin-left:6px;vertical-align:1px}
.rec{border:1px solid var(--ln);border-radius:8px;padding:10px 14px;margin-bottom:8px;background:var(--row)}
.rec h3{margin:0;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:10px;border:1px solid currentColor;margin-left:8px;vertical-align:1px;font-weight:500}
.rec p{margin:3px 0 0;color:var(--mu);font-size:13px}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px;font:12px/1.5 ui-monospace,Menlo,monospace}
.btn{background:var(--ac);color:var(--acx);font-weight:600;border:0;border-radius:6px;padding:7px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin:8px 8px 0 0}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:400}
#msg{font-size:13px;color:var(--wn)}
a{color:var(--ac)}
th[data-t]{cursor:pointer;user-select:none}th[data-t]:hover{color:var(--tx)}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg text{fill:var(--mu);font-size:10px}
@media (max-width:640px){.bar{gap:8px}.nav nav{order:3;flex-basis:100%}section{padding:14px}}
</style>
</head>

<section id="s-glove"><h2 data-k="gt"></h2><p class="note" data-k="gn"></p><input id="gq" type="search" style="width:100%;max-width:280px;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit"><div class="wrap" style="max-height:480px;overflow:auto"><table id="gtab"></table></div></section>

<section><h2 data-k="ut"></h2><p class="note" data-k="un"></p><input id="uq" type="search" style="width:100%;max-width:280px;margin-bottom:8px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;font:inherit"><div class="wrap" style="max-height:480px;overflow:auto"><table id="utab"></table></div></section>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US'),pc=n=>(n>0?'+':'')+(n*100).toFixed(1)+'%',cls=n=>n>0?'up':n<0?'dn':'';

 }

 $(tid).innerHTML='<tr>'+H.map((h,j)=>hd(tt,[2,4,6].includes(j)?h+' '+sym():h,j,j==1?'text-align:left':'')).join('')+'</tr>'+A.map(({n,nm,r})=>`<tr><td>${n}</td><td style="text-align:left">${fn(nm)}</td><td>${M(r[1]).toFixed(2)}</td><td class="${cls(r[2])}">${r[2]>0?'+':''}${r[2].toFixed(2)}%</td><td>${M(r[1]/(1+r[2]/100)).toFixed(2)}</td><td>${fmt(r[3])}</td><td>${fmt(M(r[4]*1e4))}</td><td>${r[5].toFixed(2)}</td><td>${fmt(r[6])}</td></tr>`).join('')}
function renderKnives(){tbl('#ktab','#kq',DS.KG)}function renderGloves(){tbl('#gtab','#gq',DS.GG)}function renderGL(){tbl('#gtab2','#gq2',DS.GL)}function renderSL(){tbl('#stab','#sq',DS.KS)}function renderUL(){tbl('#utab','#uq',DS.GS)}
$('#kq').oninput=renderKnives;$('#gq').oninput=renderGloves;$('#gq2').oninput=renderGL;$('#sq').oninput=renderSL;$('#uq').oninput=renderUL;
function allD(){return DS.KL.concat(DS.GL).map(r=>[tw(r[0]),0,r[1],r[2]/100,r[3],r[4]*1e4,r[5],r[6]])}
function allRec(){const o=new Map();Object.keys(DS).forEach(k=>DS[k].forEach(r=>{const nm=tw(r[0]);if(!o.has(nm))o.set(nm,{nm,kind:r[7],p:r[1],ch:r[2],s:r[3],t:r[4],v:r[5],l:r[6]})}));return[...o.values()]}

function initData(d){META=d.meta;UPD=META.updated_at;DS=d.legacy;initNames(d.nameMap);REAL.cat=META.legacy_summary.cat;REAL.d=UPD;REAL.rows=DS.KL.map(r=>[tw(r[0]),r[0],r[1],r[2]/100,r[3],r[4]*1e4,r[5],r[6],null])}
if(typeof HistoryChart!='undefined')HistoryChart.init({lang:()=>lang,money:M,sym,fmt,pc,cls,esc});
$('#stamp').textContent='資料載入中… / 数据加载中…';
CSStore.load('.').then(d=>{initData(d);render()}).catch(e=>{$('#stamp').textContent='資料載入失敗 / 数据加载失败：'+e.message;console.error(e)});
